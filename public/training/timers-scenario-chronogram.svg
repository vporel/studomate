	<line x1="295" y1="40" x2="295" y2="282" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<text x="295" y="298" font-size="11" text-anchor="middle" fill="#607d8b">5</text>
	<line x1="320" y1="40" x2="320" y2="282" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<text x="320" y="298" font-size="11" text-anchor="middle" fill="#607d8b">6</text>
	<line x1="345" y1="40" x2="345" y2="282" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<text x="345" y="298" font-size="11" text-anchor="middle" fill="#607d8b">7</text>
	<line x1="370" y1="40" x2="370" y2="282" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<text x="370" y="298" font-size="11" text-anchor="middle" fill="#607d8b">8</text>
	<line x1="395" y1="40" x2="395" y2="282" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<text x="395" y="298" font-size="11" text-anchor="middle" fill="#607d8b">9</text>
	<line x1="420" y1="40" x2="420" y2="282" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<text x="420" y="298" font-size="11" text-anchor="middle" fill="#607d8b">10</text>
	<line x1="445" y1="40" x2="445" y2="282" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<text x="445" y="298" font-size="11" text-anchor="middle" fill="#607d8b">11</text>
	<line x1="470" y1="40" x2="470" y2="282" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<text x="470" y="298" font-size="11" text-anchor="middle" fill="#607d8b">12</text>
	<line x1="495" y1="40" x2="495" y2="282" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<text x="495" y="298" font-size="11" text-anchor="middle" fill="#607d8b">13</text>
	<line x1="520" y1="40" x2="520" y2="282" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<text x="520" y="298" font-size="11" text-anchor="middle" fill="#607d8b">14</text>
	<text x="534" y="298" font-size="11" text-anchor="start" fill="#607d8b">s</text>

	<!-- Signals -->
	<text x="8" y="62" font-size="12" font-weight="bold" text-anchor="start" fill="#263238">IN</text>
	<path d="M 170 70 L 195 70 L 195 46 L 295 46 L 295 70 L 370 70 L 370 46 L 395 46 L 395 70 L 407.5 70 L 407.5 46 L 470 46 L 470 70 L 520 70" fill="none" stroke="#263238" stroke-width="2.2" stroke-linejoin="round" />
	<text x="8" y="112" font-size="12" font-weight="bold" text-anchor="start" fill="#263238">Q TON</text>
	<path d="M 170 120 L 245 120 L 245 96 L 295 96 L 295 120 L 457.5 120 L 457.5 96 L 470 96 L 470 120 L 520 120" fill="none" stroke="#2e7d32" stroke-width="2.2" stroke-linejoin="round" />
	<text x="8" y="162" font-size="12" font-weight="bold" text-anchor="start" fill="#263238">Q TOF</text>
	<path d="M 170 170 L 195 170 L 195 146 L 345 146 L 345 170 L 370 170 L 370 146 L 520 146 L 520 170 L 520 170" fill="none" stroke="#2e7d32" stroke-width="2.2" stroke-linejoin="round" />
	<text x="8" y="212" font-size="12" font-weight="bold" text-anchor="start" fill="#263238">Q TP</text>
	<path d="M 170 220 L 195 220 L 195 196 L 245 196 L 245 220 L 370 220 L 370 196 L 420 196 L 420 220 L 520 220" fill="none" stroke="#2e7d32" stroke-width="2.2" stroke-linejoin="round" />
	<text x="8" y="262" font-size="12" font-weight="bold" text-anchor="start" fill="#263238">ET (TON)</text>
	<path d="M 170 270 L 195 270 L 245 246 L 295 246 L 295 270 L 370 270 L 395 258 L 395 270 L 407.5 270 L 457.5 246 L 470 246 L 470 270 L 520 270" fill="none" stroke="#d84315" stroke-width="2.2" stroke-linejoin="round" />
	<text x="164" y="250" font-size="11" text-anchor="end" fill="#607d8b">PT</text>

	<!-- Press markers -->
	<text x="245" y="40" font-size="12" font-weight="bold" text-anchor="middle" fill="#d84315">A</text>
	<text x="382.5" y="40" font-size="12" font-weight="bold" text-anchor="middle" fill="#d84315">B</text>
	<text x="438.75" y="40" font-size="12" font-weight="bold" text-anchor="middle" fill="#d84315">C</text>
	<text x="550" y="18" font-size="11" text-anchor="end" fill="#607d8b">PT = 2 s</text>

	<!-- Legend -->
	<text x="8" y="326" font-size="11" font-weight="bold" text-anchor="start" fill="#d84315">A</text>
	<text x="26" y="326" font-size="11" text-anchor="start" fill="#455a64">Appui long : TON monte après PT, TOF retombe PT après le relâchement.</text>
	<text x="8" y="344" font-size="11" font-weight="bold" text-anchor="start" fill="#d84315">B</text>
	<text x="26" y="344" font-size="11" text-anchor="start" fill="#455a64">Appui court (1 s &lt; PT) : TON ne répond pas, TOF prolonge, TP émet quand même.</text>
	<text x="8" y="362" font-size="11" font-weight="bold" text-anchor="start" fill="#d84315">C</text>
	<text x="26" y="362" font-size="11" text-anchor="start" fill="#455a64">Nouvel appui pendant l'impulsion du TP : le TP l'ignore, le TOF reste vrai.</text>
</svg>
