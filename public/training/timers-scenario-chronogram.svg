<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="sans-serif">
	<!-- Time grid -->
	<line x1="170" y1="40" x2="170" y2="282" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<text x="170" y="298" font-size="11" text-anchor="middle" fill="#607d8b">0</text>
	<line x1="195" y1="40" x2="195" y2="282" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
