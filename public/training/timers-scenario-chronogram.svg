	<line x1="245" y1="40" x2="245" y2="282" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<text x="245" y="298" font-size="11" text-anchor="middle" fill="#607d8b">3</text>
	<line x1="270" y1="40" x2="270" y2="282" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
