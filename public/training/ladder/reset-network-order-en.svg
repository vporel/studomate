<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 322" font-family="sans-serif">
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b" />
		</marker>
	</defs>
	<rect x="70" y="12" width="300" height="58" fill="#fff" stroke="#263238" stroke-width="1.5" rx="6" />
	<text x="84" y="36" font-size="13" text-anchor="start" fill="#263238" font-weight="bold">1. Crossing conditions</text>
	<text x="84" y="56" font-size="11" text-anchor="start" fill="#455a64">Tn = Xn AND Rn</text>
	<line x1="220" y1="70" x2="220" y2="88" stroke="#607d8b" stroke-width="2.5" marker-end="url(#arrow)" />
	<rect x="70" y="88" width="300" height="58" fill="#fff" stroke="#263238" stroke-width="1.5" rx="6" />
	<text x="84" y="112" font-size="13" text-anchor="start" fill="#263238" font-weight="bold">2. Step evolution</text>
	<text x="84" y="132" font-size="11" text-anchor="start" fill="#455a64">all the resets, then all the sets</text>
	<line x1="220" y1="146" x2="220" y2="164" stroke="#607d8b" stroke-width="2.5" marker-end="url(#arrow)" />
	<rect x="70" y="164" width="300" height="58" fill="#fff" stroke="#d84315" stroke-width="2" rx="6" />
	<text x="84" y="188" font-size="13" text-anchor="start" fill="#d84315" font-weight="bold">3. Reset (arret)</text>
	<text x="84" y="208" font-size="11" text-anchor="start" fill="#455a64">reset of all steps, then set of the initial step</text>
	<line x1="220" y1="222" x2="220" y2="240" stroke="#607d8b" stroke-width="2.5" marker-end="url(#arrow)" />
	<rect x="70" y="240" width="300" height="58" fill="#fff" stroke="#263238" stroke-width="1.5" rx="6" />
	<text x="84" y="264" font-size="13" text-anchor="start" fill="#263238" font-weight="bold">4. Outputs</text>
	<text x="84" y="284" font-size="11" text-anchor="start" fill="#455a64">continuous actions</text>
	<line x1="40" y1="20" x2="40" y2="290" stroke="#607d8b" stroke-width="2.5" marker-end="url(#arrow)" />
	<text x="36" y="308" font-size="11" text-anchor="start" fill="#607d8b">execution order</text>
	<text x="392" y="98" font-size="12" text-anchor="start" fill="#d84315" font-weight="bold">The last network that writes</text>
	<text x="392" y="116" font-size="12" text-anchor="start" fill="#d84315" font-weight="bold">a memory wins.</text>
	<text x="392" y="140" font-size="11" text-anchor="start" fill="#455a64">Placed after the evolution,</text>
	<text x="392" y="156" font-size="11" text-anchor="start" fill="#455a64">the reset has the</text>
	<text x="392" y="172" font-size="11" text-anchor="start" fill="#455a64">last word: even if a</text>
	<text x="392" y="188" font-size="11" text-anchor="start" fill="#455a64">transition has just been crossed,</text>
	<text x="392" y="204" font-size="11" text-anchor="start" fill="#455a64">the steps restart from step 0.</text>
</svg>
