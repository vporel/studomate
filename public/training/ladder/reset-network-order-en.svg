<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 246" font-family="sans-serif">
	<rect x="70" y="12" width="300" height="58" fill="#fff" stroke="#263238" stroke-width="1.5" rx="6" />
	<text x="84" y="36" font-size="13" text-anchor="start" fill="#263238" font-weight="bold">1. Transition networks</text>
	<text x="84" y="56" font-size="11" text-anchor="start" fill="#455a64">Automatic_cycle: one network per transition</text>
	<rect x="70" y="88" width="300" height="58" fill="#fff" stroke="#d84315" stroke-width="2" rx="6" />
	<text x="84" y="112" font-size="13" text-anchor="start" fill="#d84315" font-weight="bold">2. Reset (stop)</text>
	<text x="84" y="132" font-size="11" text-anchor="start" fill="#455a64">in Automatic_cycle, after the transitions</text>
	<rect x="70" y="164" width="300" height="58" fill="#fff" stroke="#263238" stroke-width="1.5" rx="6" />
	<text x="84" y="188" font-size="13" text-anchor="start" fill="#263238" font-weight="bold">3. Outputs</text>
	<text x="84" y="208" font-size="11" text-anchor="start" fill="#455a64">Outputs program: one network per output</text>
	<text x="36" y="238" font-size="11" text-anchor="start" fill="#607d8b">execution order: the Main calls Automatic_cycle, then Outputs</text>
	<text x="392" y="64" font-size="12" text-anchor="start" fill="#d84315" font-weight="bold">The last network that writes</text>
	<text x="392" y="82" font-size="12" text-anchor="start" fill="#d84315" font-weight="bold">a memory wins.</text>
	<text x="392" y="106" font-size="11" text-anchor="start" fill="#455a64">Placed after the transitions,</text>
	<text x="392" y="122" font-size="11" text-anchor="start" fill="#455a64">the reset has the</text>
	<text x="392" y="138" font-size="11" text-anchor="start" fill="#455a64">last word: even if a</text>
	<text x="392" y="154" font-size="11" text-anchor="start" fill="#455a64">transition has just been crossed,</text>
	<text x="392" y="170" font-size="11" text-anchor="start" fill="#455a64">the steps restart from step 0.</text>
</svg>
