	<text x="372" y="36" font-size="12" text-anchor="start" fill="#263238" font-weight="bold">Two TONs:</text>
	<text x="372" y="56" font-size="11" text-anchor="start" fill="#263238" font-family="monospace">t_drill : IN = X2, PT = 2 s</text>
	<text x="372" y="74" font-size="11" text-anchor="start" fill="#263238" font-family="monospace">t_watchdog : IN = X1, PT = 8 s</text>
	<text x="372" y="108" font-size="12" text-anchor="start" fill="#d84315" font-weight="bold">Fallback branch (in orange):</text>
	<text x="372" y="128" font-size="11" text-anchor="start" fill="#455a64">if the drill does not reach the</text>
	<text x="372" y="144" font-size="11" text-anchor="start" fill="#455a64">bottom within 8 s, t_watchdog.Q</text>
	<text x="372" y="160" font-size="11" text-anchor="start" fill="#455a64">crosses the transition to step 3:</text>
	<text x="372" y="176" font-size="11" text-anchor="start" fill="#455a64">the drill goes back up.</text>
	<text x="372" y="210" font-size="11" text-anchor="start" fill="#455a64">The fault is latched in</text>
	<text x="372" y="226" font-size="11" text-anchor="start" fill="#455a64">fault (S coil) as soon as</text>
	<text x="372" y="242" font-size="11" text-anchor="start" fill="#455a64">t_watchdog.Q is true.</text>
</svg>
