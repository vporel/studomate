<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" font-family="sans-serif">
	<rect x="20" y="15" width="280" height="65" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" />
	<text x="35" y="38" font-size="13" font-weight="bold" fill="#0d47a1">1. Transitions</text>
	<text x="35" y="56" font-size="11" font-family="monospace" fill="#263238">Tn = Xn AND Rn</text>
	<text x="35" y="70" font-size="9.5" fill="#455a64">all computed before any evolution</text>

	<line x1="160" y1="80" x2="160" y2="105" stroke="#455a64" stroke-width="2" />
	<path d="M 154 98 L 160 108 L 166 98" fill="none" stroke="#455a64" stroke-width="2" />

	<rect x="20" y="108" width="280" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" />
	<text x="35" y="131" font-size="13" font-weight="bold" fill="#1b5e20">2. Step evolution</text>
	<text x="35" y="149" font-size="11" font-family="monospace" fill="#263238">all R, then all S</text>
	<text x="35" y="167" font-size="9.5" fill="#455a64">activation wins over deactivation</text>
	<text x="35" y="181" font-size="9.5" fill="#455a64">(rule 5)</text>

	<line x1="160" y1="188" x2="160" y2="213" stroke="#455a64" stroke-width="2" />
	<path d="M 154 206 L 160 216 L 166 206" fill="none" stroke="#455a64" stroke-width="2" />

	<rect x="20" y="216" width="280" height="65" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5" />
	<text x="35" y="239" font-size="13" font-weight="bold" fill="#e65100">3. Outputs</text>
	<text x="35" y="257" font-size="11" font-family="monospace" fill="#263238">action = Xn OR Xm OR ...</text>
	<text x="35" y="271" font-size="9.5" fill="#455a64">continuous actions, a single network</text>

	<g transform="rotate(-90 308 150)">
		<text x="308" y="150" font-size="10" fill="#607d8b" text-anchor="middle">scan direction</text>
	</g>
</svg>
