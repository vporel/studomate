	<text x="156" y="128" font-size="10" text-anchor="middle" fill="#607d8b">receptivity</text>
	<text x="260" y="160" font-size="11" text-anchor="middle" fill="#455a64">When the network is true: X1 turns off (R) and X2 turns on (S), in the same scan.</text>
