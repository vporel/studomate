<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 190" font-family="sans-serif">
	<text x="15" y="12" font-size="11" font-weight="bold" fill="#263238">OR divergence / convergence</text>
	<text x="205" y="12" font-size="11" font-weight="bold" fill="#263238">AND divergence / convergence</text>
	<line x1="195" y1="8" x2="195" y2="185" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3,3" />

	<!-- OR: divergence with no bar, one transition per branch -->
	<g stroke="#263238" stroke-width="1.8" fill="none">
		<rect x="80" y="20" width="20" height="20" />
		<line x1="90" y1="40" x2="90" y2="50" />
		<line x1="60" y1="50" x2="120" y2="50" />
		<line x1="60" y1="50" x2="60" y2="65" />
		<line x1="120" y1="50" x2="120" y2="65" />
		<line x1="54" y1="65" x2="66" y2="65" stroke-width="2.5" />
		<line x1="114" y1="65" x2="126" y2="65" stroke-width="2.5" />
		<line x1="60" y1="65" x2="60" y2="95" />
		<line x1="120" y1="65" x2="120" y2="95" />
		<rect x="50" y="95" width="20" height="20" />
		<rect x="110" y="95" width="20" height="20" />
		<line x1="60" y1="115" x2="60" y2="130" />
		<line x1="120" y1="115" x2="120" y2="130" />
		<line x1="54" y1="130" x2="66" y2="130" stroke-width="2.5" />
		<line x1="114" y1="130" x2="126" y2="130" stroke-width="2.5" />
		<line x1="60" y1="130" x2="60" y2="140" />
		<line x1="120" y1="130" x2="120" y2="140" />
		<line x1="60" y1="140" x2="120" y2="140" />
		<line x1="90" y1="140" x2="90" y2="155" />
		<rect x="80" y="155" width="20" height="20" />
	</g>
	<g font-size="10" fill="#263238" text-anchor="middle">
		<text x="90" y="34">n</text>
		<text x="60" y="109">a</text>
		<text x="120" y="109">b</text>
		<text x="90" y="169">m</text>
	</g>

	<!-- AND: single transition then a double bar -->
	<g stroke="#263238" stroke-width="1.8" fill="none">
		<rect x="280" y="20" width="20" height="20" />
		<line x1="290" y1="40" x2="290" y2="60" />
		<line x1="284" y1="50" x2="296" y2="50" stroke-width="2.5" />
		<line x1="260" y1="58" x2="320" y2="58" stroke-width="2.5" />
		<line x1="260" y1="62" x2="320" y2="62" stroke-width="2.5" />
		<line x1="260" y1="62" x2="260" y2="80" />
		<line x1="320" y1="62" x2="320" y2="80" />
		<rect x="250" y="80" width="20" height="20" />
		<rect x="310" y="80" width="20" height="20" />
		<line x1="260" y1="100" x2="260" y2="118" />
		<line x1="320" y1="100" x2="320" y2="118" />
		<line x1="260" y1="118" x2="320" y2="118" stroke-width="2.5" />
		<line x1="260" y1="122" x2="320" y2="122" stroke-width="2.5" />
		<line x1="290" y1="122" x2="290" y2="135" />
		<line x1="284" y1="135" x2="296" y2="135" stroke-width="2.5" />
		<line x1="290" y1="135" x2="290" y2="150" />
		<rect x="280" y="150" width="20" height="20" />
	</g>
	<g font-size="10" fill="#263238" text-anchor="middle">
		<text x="290" y="34">n</text>
		<text x="260" y="94">a</text>
		<text x="320" y="94">b</text>
		<text x="290" y="164">m</text>
	</g>
</svg>
