<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 246" font-family="sans-serif">
	<rect x="70" y="12" width="300" height="58" fill="#fff" stroke="#263238" stroke-width="1.5" rx="6" />
	<text x="84" y="36" font-size="13" text-anchor="start" fill="#263238" font-weight="bold">1. Réseaux de transition</text>
	<text x="84" y="56" font-size="11" text-anchor="start" fill="#455a64">Cycle_automatique : un réseau par transition</text>
	<rect x="70" y="88" width="300" height="58" fill="#fff" stroke="#d84315" stroke-width="2" rx="6" />
	<text x="84" y="112" font-size="13" text-anchor="start" fill="#d84315" font-weight="bold">2. Réinitialisation (arret)</text>
	<text x="84" y="132" font-size="11" text-anchor="start" fill="#455a64">dans Cycle_automatique, après les transitions</text>
	<rect x="70" y="164" width="300" height="58" fill="#fff" stroke="#263238" stroke-width="1.5" rx="6" />
	<text x="84" y="188" font-size="13" text-anchor="start" fill="#263238" font-weight="bold">3. Sorties</text>
	<text x="84" y="208" font-size="11" text-anchor="start" fill="#455a64">programme Sorties : un réseau par sortie</text>
	<text x="36" y="238" font-size="11" text-anchor="start" fill="#607d8b">ordre d'exécution : le Main appelle Cycle_automatique, puis Sorties</text>
	<text x="392" y="64" font-size="12" text-anchor="start" fill="#d84315" font-weight="bold">Le dernier réseau qui écrit</text>
	<text x="392" y="82" font-size="12" text-anchor="start" fill="#d84315" font-weight="bold">une mémoire l'emporte.</text>
	<text x="392" y="106" font-size="11" text-anchor="start" fill="#455a64">Placée après les transitions,</text>
	<text x="392" y="122" font-size="11" text-anchor="start" fill="#455a64">la réinitialisation a le</text>
	<text x="392" y="138" font-size="11" text-anchor="start" fill="#455a64">dernier mot : même si une</text>
	<text x="392" y="154" font-size="11" text-anchor="start" fill="#455a64">transition vient d'être franchie,</text>
	<text x="392" y="170" font-size="11" text-anchor="start" fill="#455a64">les étapes repartent de l'étape 0.</text>
</svg>
