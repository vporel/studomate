<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="sans-serif">
	<!-- Rails -->
	<line x1="20" y1="26" x2="20" y2="116" stroke="#263238" stroke-width="3" />
	<line x1="20" y1="126" x2="20" y2="216" stroke="#263238" stroke-width="3" />
	<line x1="20" y1="226" x2="20" y2="316" stroke="#263238" stroke-width="3" />
	<line x1="20" y1="326" x2="20" y2="416" stroke="#263238" stroke-width="3" />

	<!-- Compare -->
	<line x1="20" y1="56" x2="120" y2="56" stroke="#263238" stroke-width="2" />
	<rect x="120" y="39" width="70" height="34" rx="2" fill="#fff" stroke="#263238" stroke-width="1.5" />
	<text x="155" y="61" font-size="13" font-weight="bold" text-anchor="middle" fill="#263238">&lt;</text>
	<text x="155" y="33" font-size="10" text-anchor="middle" fill="#d84315">niveau</text>
	<text x="155" y="87" font-size="10" text-anchor="middle" fill="#d84315">20</text>
	<line x1="190" y1="56" x2="330" y2="56" stroke="#263238" stroke-width="2" />

	<!-- Assign -->
	<line x1="20" y1="156" x2="150" y2="156" stroke="#263238" stroke-width="2" />
	<rect x="150" y="130" width="100" height="58" rx="4" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
	<text x="200" y="126" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">Assign</text>
	<text x="154" y="160" font-size="10" text-anchor="start" fill="#263238">EN</text>
	<text x="246" y="160" font-size="10" text-anchor="end" fill="#263238">ENO</text>
	<text x="154" y="184" font-size="10" font-family="monospace" text-anchor="start" fill="#263238">IN</text>
	<text x="146" y="184" font-size="10" text-anchor="end" fill="#d84315">niveau</text>
	<text x="246" y="184" font-size="10" font-family="monospace" text-anchor="end" fill="#263238">OUT</text>
	<text x="254" y="184" font-size="10" text-anchor="start" fill="#d84315">niveau_memo</text>
	<line x1="250" y1="156" x2="330" y2="156" stroke="#263238" stroke-width="2" />

	<!-- Arithmetic -->
	<line x1="20" y1="256" x2="170" y2="256" stroke="#263238" stroke-width="2" />
	<rect x="170" y="230" width="100" height="76" rx="4" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
	<text x="220" y="226" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">Calc</text>
	<text x="174" y="260" font-size="10" text-anchor="start" fill="#263238">EN</text>
	<text x="266" y="260" font-size="10" text-anchor="end" fill="#263238">ENO</text>
	<text x="174" y="284" font-size="10" font-family="monospace" text-anchor="start" fill="#263238">IN1</text>
	<text x="166" y="284" font-size="10" text-anchor="end" fill="#d84315">nb_demarrages</text>
	<text x="174" y="302" font-size="10" font-family="monospace" text-anchor="start" fill="#263238">IN2</text>
	<text x="166" y="302" font-size="10" text-anchor="end" fill="#d84315">1</text>
	<text x="266" y="302" font-size="10" font-family="monospace" text-anchor="end" fill="#263238">OUT</text>
	<text x="274" y="302" font-size="10" text-anchor="start" fill="#d84315">nb_demarrages</text>
	<text x="220" y="287" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">+</text>
	<line x1="270" y1="256" x2="330" y2="256" stroke="#263238" stroke-width="2" />

	<!-- Convert -->
	<line x1="20" y1="356" x2="170" y2="356" stroke="#263238" stroke-width="2" />
	<rect x="170" y="330" width="120" height="58" rx="4" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
	<text x="230" y="326" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">REAL_TO_INT</text>
	<text x="174" y="360" font-size="10" text-anchor="start" fill="#263238">EN</text>
	<text x="286" y="360" font-size="10" text-anchor="end" fill="#263238">ENO</text>
	<text x="174" y="384" font-size="10" font-family="monospace" text-anchor="start" fill="#263238">IN</text>
	<text x="166" y="384" font-size="10" text-anchor="end" fill="#d84315">calcul_real</text>
	<text x="286" y="384" font-size="10" font-family="monospace" text-anchor="end" fill="#263238">OUT</text>
	<text x="294" y="384" font-size="10" text-anchor="start" fill="#d84315">niveau</text>
	<line x1="290" y1="356" x2="330" y2="356" stroke="#263238" stroke-width="2" />

	<!-- Captions -->
	<text x="400" y="52" font-size="13" font-weight="bold" text-anchor="start" fill="#263238">Comparaison</text>
	<text x="400" y="70" font-size="11" text-anchor="start" fill="#455a64">se place comme un contact</text>
	<text x="400" y="152" font-size="13" font-weight="bold" text-anchor="start" fill="#263238">Affectation</text>
	<text x="400" y="170" font-size="11" text-anchor="start" fill="#455a64">out := in (le MOVE de la norme)</text>
	<text x="400" y="252" font-size="13" font-weight="bold" text-anchor="start" fill="#263238">Calcul</text>
	<text x="400" y="270" font-size="11" text-anchor="start" fill="#455a64">out := in1 op in2 (2 opérandes)</text>
	<text x="400" y="352" font-size="13" font-weight="bold" text-anchor="start" fill="#263238">Conversion</text>
	<text x="400" y="370" font-size="11" text-anchor="start" fill="#455a64">vers le type de la variable out</text>
	<text x="8" y="434" font-size="11" text-anchor="start" fill="#607d8b">EN : autorisation d'exécuter. ENO : cette autorisation, transmise au bloc suivant.</text>
</svg>
