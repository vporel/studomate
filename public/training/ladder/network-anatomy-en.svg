	<text x="400" y="190" font-size="11" text-anchor="middle" fill="#2e7d32" font-weight="bold">lamp = 1</text>
	<text x="300" y="244" font-size="11" text-anchor="start" fill="#263238" font-weight="bold">in parallel = OR</text>
	<text x="8" y="290" font-size="11" text-anchor="start" fill="#455a64">green: conducting path, the coil is energised</text>
