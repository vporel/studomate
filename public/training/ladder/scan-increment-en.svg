	<line x1="310" y1="30" x2="310" y2="296" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<line x1="350" y1="30" x2="350" y2="296" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<line x1="390" y1="30" x2="390" y2="296" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<line x1="430" y1="30" x2="430" y2="296" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<line x1="470" y1="30" x2="470" y2="296" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<text x="8" y="24" font-size="11" text-anchor="start" fill="#607d8b">scan</text>
	<text x="170" y="24" font-size="11" text-anchor="middle" fill="#607d8b">1</text>
	<text x="210" y="24" font-size="11" text-anchor="middle" fill="#607d8b">2</text>
	<text x="250" y="24" font-size="11" text-anchor="middle" fill="#607d8b">3</text>
	<text x="290" y="24" font-size="11" text-anchor="middle" fill="#607d8b">4</text>
	<text x="330" y="24" font-size="11" text-anchor="middle" fill="#607d8b">5</text>
	<text x="370" y="24" font-size="11" text-anchor="middle" fill="#607d8b">6</text>
	<text x="410" y="24" font-size="11" text-anchor="middle" fill="#607d8b">7</text>
	<text x="450" y="24" font-size="11" text-anchor="middle" fill="#607d8b">8</text>

	<!-- Without P contact -->
	<text x="8" y="52" font-size="12" font-weight="bold" text-anchor="start" fill="#263238">Without a P contact: the count climbs on every scan</text>
	<text x="8" y="96" font-size="12" font-weight="bold" text-anchor="start" fill="#263238">sensor</text>
	<path d="M 150 100 L 190 100 L 190 80 L 390 80 L 390 100 L 470 100" fill="none" stroke="#263238" stroke-width="2.2" stroke-linejoin="round" />
	<text x="8" y="134" font-size="12" font-weight="bold" text-anchor="start" fill="#263238">spaces</text>
	<rect x="150" y="116" width="40" height="24" fill="#fff" stroke="#263238" stroke-width="1.2" />
	<text x="170" y="133" font-size="12" text-anchor="middle" fill="#263238">0</text>
	<rect x="190" y="116" width="40" height="24" fill="#ffe0b2" stroke="#263238" stroke-width="1.2" />
	<text x="210" y="133" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">1</text>
	<rect x="230" y="116" width="40" height="24" fill="#ffe0b2" stroke="#263238" stroke-width="1.2" />
	<text x="250" y="133" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">2</text>
	<rect x="270" y="116" width="40" height="24" fill="#ffe0b2" stroke="#263238" stroke-width="1.2" />
	<text x="290" y="133" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">3</text>
	<rect x="310" y="116" width="40" height="24" fill="#ffe0b2" stroke="#263238" stroke-width="1.2" />
	<text x="330" y="133" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">4</text>
	<rect x="350" y="116" width="40" height="24" fill="#ffe0b2" stroke="#263238" stroke-width="1.2" />
	<text x="370" y="133" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">5</text>
	<rect x="390" y="116" width="40" height="24" fill="#fff" stroke="#263238" stroke-width="1.2" />
	<text x="410" y="133" font-size="12" text-anchor="middle" fill="#263238">5</text>
	<rect x="430" y="116" width="40" height="24" fill="#fff" stroke="#263238" stroke-width="1.2" />
	<text x="450" y="133" font-size="12" text-anchor="middle" fill="#263238">5</text>

	<!-- With P contact -->
	<text x="8" y="168" font-size="12" font-weight="bold" text-anchor="start" fill="#263238">With a P contact: once per press</text>
	<text x="8" y="212" font-size="12" font-weight="bold" text-anchor="start" fill="#263238">sensor</text>
	<path d="M 150 216 L 190 216 L 190 196 L 390 196 L 390 216 L 470 216" fill="none" stroke="#263238" stroke-width="2.2" stroke-linejoin="round" />
	<text x="8" y="252" font-size="12" font-weight="bold" text-anchor="start" fill="#263238">P contact</text>
	<path d="M 150 256 L 190 256 L 190 236 L 230 236 L 230 256 L 470 256" fill="none" stroke="#2e7d32" stroke-width="2.2" stroke-linejoin="round" />
	<text x="8" y="292" font-size="12" font-weight="bold" text-anchor="start" fill="#263238">spaces</text>
	<rect x="150" y="270" width="40" height="24" fill="#fff" stroke="#263238" stroke-width="1.2" />
	<text x="170" y="287" font-size="12" text-anchor="middle" fill="#263238">0</text>
	<rect x="190" y="270" width="40" height="24" fill="#ffe0b2" stroke="#263238" stroke-width="1.2" />
	<text x="210" y="287" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">1</text>
	<rect x="230" y="270" width="40" height="24" fill="#fff" stroke="#263238" stroke-width="1.2" />
	<text x="250" y="287" font-size="12" text-anchor="middle" fill="#263238">1</text>
	<rect x="270" y="270" width="40" height="24" fill="#fff" stroke="#263238" stroke-width="1.2" />
	<text x="290" y="287" font-size="12" text-anchor="middle" fill="#263238">1</text>
	<rect x="310" y="270" width="40" height="24" fill="#fff" stroke="#263238" stroke-width="1.2" />
	<text x="330" y="287" font-size="12" text-anchor="middle" fill="#263238">1</text>
	<rect x="350" y="270" width="40" height="24" fill="#fff" stroke="#263238" stroke-width="1.2" />
	<text x="370" y="287" font-size="12" text-anchor="middle" fill="#263238">1</text>
	<rect x="390" y="270" width="40" height="24" fill="#fff" stroke="#263238" stroke-width="1.2" />
	<text x="410" y="287" font-size="12" text-anchor="middle" fill="#263238">1</text>
	<rect x="430" y="270" width="40" height="24" fill="#fff" stroke="#263238" stroke-width="1.2" />
	<text x="450" y="287" font-size="12" text-anchor="middle" fill="#263238">1</text>
