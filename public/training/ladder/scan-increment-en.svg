<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 312" font-family="sans-serif">
	<!-- Cycle columns -->
	<line x1="150" y1="30" x2="150" y2="296" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<line x1="190" y1="30" x2="190" y2="296" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<line x1="230" y1="30" x2="230" y2="296" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
