<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" font-family="sans-serif">
	<text x="8" y="18" font-size="12" text-anchor="start" fill="#263238" font-weight="bold">Network 1: activate the initial step</text>
	<line x1="80" y1="52" x2="80" y2="72" stroke="#263238" stroke-width="2.5" />
	<line x1="92" y1="52" x2="92" y2="72" stroke="#263238" stroke-width="2.5" />
	<line x1="78" y1="73" x2="94" y2="51" stroke="#263238" stroke-width="2" />
	<text x="86" y="47" font-size="11" text-anchor="middle" fill="#263238" font-family="monospace">init</text>
	<path d="M 232 52 Q 225 62 232 72" fill="none" stroke="#263238" stroke-width="2.5" />
	<path d="M 248 52 Q 255 62 248 72" fill="none" stroke="#263238" stroke-width="2.5" />
	<text x="240" y="65.5" font-size="10" text-anchor="middle" fill="#263238" font-weight="bold">S</text>
	<text x="240" y="47" font-size="11" text-anchor="middle" fill="#263238" font-family="monospace">X0</text>
	<line x1="40" y1="62" x2="80" y2="62" stroke="#263238" stroke-width="2" />
	<line x1="92" y1="62" x2="232" y2="62" stroke="#263238" stroke-width="2" />
	<line x1="248" y1="62" x2="280" y2="62" stroke="#263238" stroke-width="2" />
	<line x1="40" y1="40" x2="40" y2="84" stroke="#263238" stroke-width="3" />
	<line x1="280" y1="40" x2="280" y2="84" stroke="#263238" stroke-width="3" />
	<text x="32" y="66" font-size="11" text-anchor="end" fill="#607d8b">1</text>
	<text x="8" y="108" font-size="12" text-anchor="start" fill="#263238" font-weight="bold">Network 2: latch init</text>
	<line x1="80" y1="142" x2="80" y2="162" stroke="#263238" stroke-width="2.5" />
	<line x1="92" y1="142" x2="92" y2="162" stroke="#263238" stroke-width="2.5" />
	<line x1="78" y1="163" x2="94" y2="141" stroke="#263238" stroke-width="2" />
	<text x="86" y="137" font-size="11" text-anchor="middle" fill="#263238" font-family="monospace">init</text>
	<path d="M 232 142 Q 225 152 232 162" fill="none" stroke="#263238" stroke-width="2.5" />
	<path d="M 248 142 Q 255 152 248 162" fill="none" stroke="#263238" stroke-width="2.5" />
	<text x="240" y="155.5" font-size="10" text-anchor="middle" fill="#263238" font-weight="bold">S</text>
	<text x="240" y="137" font-size="11" text-anchor="middle" fill="#263238" font-family="monospace">init</text>
	<line x1="40" y1="152" x2="80" y2="152" stroke="#263238" stroke-width="2" />
	<line x1="92" y1="152" x2="232" y2="152" stroke="#263238" stroke-width="2" />
	<line x1="248" y1="152" x2="280" y2="152" stroke="#263238" stroke-width="2" />
	<line x1="40" y1="130" x2="40" y2="174" stroke="#263238" stroke-width="3" />
	<line x1="280" y1="130" x2="280" y2="174" stroke="#263238" stroke-width="3" />
	<text x="32" y="156" font-size="11" text-anchor="end" fill="#607d8b">2</text>
	<rect x="300" y="8" width="252" height="26" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
	<text x="308" y="26" font-size="12" text-anchor="start" fill="#263238" font-weight="bold">Scan</text>
	<text x="358" y="26" font-size="12" text-anchor="start" fill="#263238" font-weight="bold" font-family="monospace">init</text>
	<text x="414" y="26" font-size="12" text-anchor="start" fill="#263238" font-weight="bold">Result</text>
	<rect x="300" y="34" width="252" height="44" fill="#fff" stroke="#263238" stroke-width="1.5" />
	<text x="308" y="60" font-size="12" text-anchor="start" fill="#263238">1</text>
	<text x="358" y="60" font-size="11" text-anchor="start" fill="#263238">0 (false)</text>
	<text x="414" y="51" font-size="11" text-anchor="start" fill="#263238">X0 set,</text>
	<text x="414" y="65" font-size="11" text-anchor="start" fill="#263238">init latched</text>
	<rect x="300" y="78" width="252" height="44" fill="#fff" stroke="#263238" stroke-width="1.5" />
	<text x="308" y="104" font-size="12" text-anchor="start" fill="#263238">2</text>
	<text x="358" y="104" font-size="11" text-anchor="start" fill="#263238">1</text>
	<text x="414" y="95" font-size="11" text-anchor="start" fill="#263238">nothing more:</text>
	<text x="414" y="109" font-size="11" text-anchor="start" fill="#263238">X0 evolves alone</text>
	<rect x="300" y="122" width="252" height="32" fill="#fff" stroke="#263238" stroke-width="1.5" />
	<text x="308" y="142" font-size="12" text-anchor="start" fill="#263238">3</text>
	<text x="358" y="142" font-size="11" text-anchor="start" fill="#263238">1</text>
	<text x="414" y="142" font-size="11" text-anchor="start" fill="#263238">same</text>
	<text x="8" y="214" font-size="12" text-anchor="start" fill="#455a64">init is false at start-up: network 1 activates X0 only once.</text>
	<text x="8" y="232" font-size="12" text-anchor="start" fill="#455a64">Place these two networks before the crossing conditions.</text>
</svg>
