<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="sans-serif">
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#263238" />
		</marker>
		<marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
		</marker>
		<marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#d84315" />
		</marker>
	</defs>

	<!-- Conveyor -->
	<rect x="110" y="150" width="270" height="16" rx="8" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
	<circle cx="130" cy="158" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<circle cx="170" cy="158" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<circle cx="210" cy="158" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<circle cx="250" cy="158" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<circle cx="290" cy="158" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<circle cx="330" cy="158" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<circle cx="370" cy="158" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<rect x="150" y="128" width="22" height="22" rx="2" fill="#ffe0b2" stroke="#263238" stroke-width="1.5" />
	<rect x="220" y="128" width="22" height="22" rx="2" fill="#ffe0b2" stroke="#263238" stroke-width="1.5" />
	<line x1="130" y1="118" x2="200" y2="118" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)" />
	<text x="190" y="188" font-size="12" text-anchor="middle" fill="#263238">conveyor</text>
	<rect x="232" y="175" width="18" height="18" rx="3" fill="#ffcc80" stroke="#263238" stroke-width="1.2" />
	<text x="241" y="188" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">S</text>

	<!-- Motor and thermal relay -->
	<circle cx="70" cy="158" r="24" fill="#fff" stroke="#263238" stroke-width="2" />
	<text x="70" y="164" font-size="16" font-weight="bold" text-anchor="middle" fill="#263238">M</text>
	<line x1="94" y1="158" x2="110" y2="158" stroke="#263238" stroke-width="2.5" />
	<rect x="30" y="60" width="80" height="34" rx="4" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
	<text x="70" y="82" font-size="12" text-anchor="middle" fill="#263238">thermal</text>
	<line x1="70" y1="94" x2="70" y2="134" stroke="#263238" stroke-width="1.5" stroke-dasharray="4 3" />
	<rect x="112" y="66" width="18" height="18" rx="3" fill="#bbdefb" stroke="#263238" stroke-width="1.2" />
	<text x="121" y="79" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">E</text>

	<!-- Part sensor and case -->
	<rect x="300" y="90" width="50" height="24" rx="4" fill="#bbdefb" stroke="#263238" stroke-width="1.5" />
	<line x1="325" y1="114" x2="325" y2="150" stroke="#607d8b" stroke-width="1.5" stroke-dasharray="3 3" />
	<text x="325" y="82" font-size="12" text-anchor="middle" fill="#263238">part sensor</text>
	<rect x="354" y="94" width="18" height="18" rx="3" fill="#bbdefb" stroke="#263238" stroke-width="1.2" />
	<text x="363" y="107" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">E</text>
	<rect x="400" y="120" width="90" height="46" fill="none" stroke="#263238" stroke-width="2" stroke-dasharray="4 3" />
	<text x="445" y="188" font-size="12" text-anchor="middle" fill="#263238">case</text>
	<line x1="380" y1="140" x2="398" y2="140" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)" />

	<!-- Fault lamp -->
	<circle cx="500" cy="50" r="18" fill="#fff9c4" stroke="#263238" stroke-width="1.5" />
	<text x="500" y="90" font-size="12" text-anchor="middle" fill="#263238">fault lamp</text>
	<rect x="468" y="98" width="18" height="18" rx="3" fill="#ffcc80" stroke="#263238" stroke-width="1.2" />
	<text x="477" y="111" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">S</text>

	<!-- Operator panel -->
	<rect x="20" y="220" width="360" height="62" rx="6" fill="none" stroke="#607d8b" stroke-width="1.2" />
	<circle cx="50" cy="251" r="12" fill="#c8e6c9" stroke="#263238" stroke-width="1.8" />
	<text x="70" y="256" font-size="12" text-anchor="start" fill="#263238">Start</text>
	<rect x="126" y="242" width="18" height="18" rx="3" fill="#bbdefb" stroke="#263238" stroke-width="1.2" />
	<text x="135" y="255" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">E</text>
	<circle cx="170" cy="251" r="12" fill="#ef9a9a" stroke="#263238" stroke-width="1.8" />
	<text x="190" y="256" font-size="12" text-anchor="start" fill="#263238">Stop</text>
	<rect x="246" y="242" width="18" height="18" rx="3" fill="#bbdefb" stroke="#263238" stroke-width="1.2" />
	<text x="255" y="255" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">E</text>
	<circle cx="290" cy="251" r="12" fill="#fff" stroke="#263238" stroke-width="1.8" />
	<text x="310" y="256" font-size="12" text-anchor="start" fill="#263238">Reset</text>
	<rect x="366" y="242" width="18" height="18" rx="3" fill="#bbdefb" stroke="#263238" stroke-width="1.2" />
	<text x="375" y="255" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">E</text>

	<!-- Legend -->
	<rect x="410" y="232" width="18" height="18" rx="3" fill="#bbdefb" stroke="#263238" stroke-width="1.2" />
	<text x="419" y="245" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">E</text>
	<text x="434" y="245" font-size="12" text-anchor="start" fill="#263238">input</text>
	<rect x="410" y="258" width="18" height="18" rx="3" fill="#ffcc80" stroke="#263238" stroke-width="1.2" />
	<text x="419" y="271" font-size="11" font-weight="bold" text-anchor="middle" fill="#263238">S</text>
	<text x="434" y="271" font-size="12" text-anchor="start" fill="#263238">output</text>
</svg>
