<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" font-family="sans-serif">
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#263238" />
		</marker>
		<marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
		</marker>
		<marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#d84315" />
		</marker>
	</defs>

	<circle cx="150" cy="130" r="80" fill="#eceff1" stroke="#263238" stroke-width="2" />
	<path d="M 150 50 A 80 80 0 0 1 150 210" fill="none" stroke="#2e7d32" stroke-width="4" />
	<path d="M 150 210 A 80 80 0 0 1 150 50" fill="none" stroke="#607d8b" stroke-width="4" />
	<text x="150" y="44" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">0</text>
	<text x="238" y="134" font-size="11" text-anchor="start" fill="#263238">16 384</text>
	<text x="62" y="134" font-size="11" text-anchor="end" fill="#263238">-16 384</text>
	<circle cx="150" cy="210" r="6" fill="#d84315" stroke="#d84315" stroke-width="1.5" />
	<text x="140" y="230" font-size="12" font-weight="bold" text-anchor="end" fill="#263238">32 767</text>
	<text x="160" y="230" font-size="12" font-weight="bold" text-anchor="start" fill="#263238">-32 768</text>
	<text x="150" y="126" font-size="18" font-weight="bold" text-anchor="middle" fill="#263238">INT</text>
	<text x="150" y="144" font-size="11" text-anchor="middle" fill="#455a64">16 bits</text>

	<!-- Explanations -->
	<text x="300" y="70" font-size="12" font-weight="bold" text-anchor="start" fill="#263238">Like an odometer</text>
	<text x="300" y="88" font-size="12" text-anchor="start" fill="#263238">that rolls back to zero, an INT</text>
	<text x="300" y="106" font-size="12" text-anchor="start" fill="#263238">goes from 32,767 to -32,768.</text>
	<text x="300" y="150" font-size="12" font-weight="bold" text-anchor="start" fill="#263238">13 824 × 100 = 1 382 400</text>
	<text x="300" y="168" font-size="12" text-anchor="start" fill="#263238">out of range: stored in an INT,</text>
	<text x="300" y="186" font-size="12" text-anchor="start" fill="#263238">the result wraps around to</text>
	<text x="300" y="206" font-size="16" font-weight="bold" text-anchor="start" fill="#d84315">6 144</text>
</svg>
