<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="sans-serif">
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#263238" />
		</marker>
		<marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
		</marker>
		<marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#d84315" />
		</marker>
	</defs>

	<!-- Lamps -->
	<text x="210" y="14" font-size="11" text-anchor="middle" fill="#455a64">QU: CV ≥ PV</text>
	<circle cx="210" cy="40" r="14" fill="#fff9c4" stroke="#263238" stroke-width="1.5" />
	<text x="210" y="70" font-size="11" text-anchor="middle" fill="#263238">buffer_full</text>
	<text x="350" y="14" font-size="11" text-anchor="middle" fill="#455a64">QD: CV ≤ 0</text>
	<circle cx="350" cy="40" r="14" fill="#fff9c4" stroke="#263238" stroke-width="1.5" />
	<text x="350" y="70" font-size="11" text-anchor="middle" fill="#263238">buffer_empty</text>

	<!-- Conveyor -->
	<rect x="20" y="166" width="520" height="14" rx="7" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
	<circle cx="40" cy="173" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<circle cx="80" cy="173" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<circle cx="120" cy="173" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<circle cx="160" cy="173" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<circle cx="200" cy="173" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<circle cx="240" cy="173" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<circle cx="280" cy="173" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<circle cx="320" cy="173" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<circle cx="360" cy="173" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<circle cx="400" cy="173" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<circle cx="440" cy="173" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<circle cx="480" cy="173" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<circle cx="520" cy="173" r="4" fill="none" stroke="#607d8b" stroke-width="1" />
	<line x1="30" y1="150" x2="70" y2="150" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)" />

	<!-- Buffer zone (3 places) -->
	<text x="280" y="94" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">buffer zone: capacity PV = 3</text>
	<rect x="160" y="104" width="240" height="56" fill="none" stroke="#607d8b" stroke-width="1.5" stroke-dasharray="4 3" />
	<rect x="180" y="114" width="40" height="36" rx="3" fill="#ffe0b2" stroke="#263238" stroke-width="1.5" />
	<rect x="250" y="114" width="40" height="36" rx="3" fill="#ffe0b2" stroke="#263238" stroke-width="1.5" />
	<rect x="320" y="114" width="40" height="36" rx="3" fill="#fff" stroke="#263238" stroke-width="1.5" />

	<!-- Sensors -->
	<rect x="100" y="190" width="60" height="26" rx="4" fill="#bbdefb" stroke="#263238" stroke-width="1.5" />
	<text x="130" y="207" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">E</text>
	<line x1="130" y1="190" x2="130" y2="180" stroke="#263238" stroke-width="2" />
	<text x="130" y="232" font-size="11" text-anchor="middle" fill="#263238">entry_sensor</text>
	<text x="130" y="248" font-size="11" text-anchor="middle" fill="#455a64">part in: CV + 1 (CU)</text>
	<rect x="400" y="190" width="60" height="26" rx="4" fill="#bbdefb" stroke="#263238" stroke-width="1.5" />
	<text x="430" y="207" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">E</text>
	<line x1="430" y1="190" x2="430" y2="180" stroke="#263238" stroke-width="2" />
	<text x="430" y="232" font-size="11" text-anchor="middle" fill="#263238">exit_sensor</text>
	<text x="430" y="248" font-size="11" text-anchor="middle" fill="#455a64">part out: CV - 1 (CD)</text>
</svg>
