<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" font-family="sans-serif">
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#263238" />
		</marker>
		<marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
		</marker>
		<marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#d84315" />
		</marker>
	</defs>

	<rect x="10" y="30" width="500" height="104" rx="10" fill="none" stroke="#263238" stroke-width="2" />
	<text x="26" y="52" font-size="13" font-weight="bold" text-anchor="start" fill="#263238">Main: run on every scan</text>
	<rect x="40" y="70" width="120" height="46" rx="6" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
	<circle cx="56" cy="93" r="10" fill="#fff" stroke="#455a64" stroke-width="1.2" />
	<text x="56" y="97" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">1</text>
	<text x="114" y="98" font-size="13" text-anchor="middle" fill="#263238">Faults</text>
	<rect x="200" y="70" width="120" height="46" rx="6" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
	<circle cx="216" cy="93" r="10" fill="#fff" stroke="#455a64" stroke-width="1.2" />
	<text x="216" y="97" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">2</text>
	<text x="274" y="98" font-size="13" text-anchor="middle" fill="#263238">Run</text>
	<rect x="360" y="70" width="120" height="46" rx="6" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
	<circle cx="376" cy="93" r="10" fill="#fff" stroke="#455a64" stroke-width="1.2" />
	<text x="376" y="97" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">3</text>
	<text x="434" y="98" font-size="13" text-anchor="middle" fill="#263238">Counting</text>
	<line x1="160" y1="93" x2="198" y2="93" stroke="#263238" stroke-width="2.5" marker-end="url(#arrow)" />
	<line x1="320" y1="93" x2="358" y2="93" stroke="#263238" stroke-width="2.5" marker-end="url(#arrow)" />

	<!-- Back to the start of the next scan -->
	<path d="M 440 134 L 440 166 L 100 166 L 100 118" fill="none" stroke="#455a64" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)" />
	<text x="270" y="186" font-size="11" text-anchor="middle" fill="#455a64">next scan: start again at 1</text>
	<text x="10" y="16" font-size="12" text-anchor="start" fill="#455a64">The numbers show the order of execution</text>
</svg>
