<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="sans-serif">
	<text x="8" y="18" font-size="13" text-anchor="start" fill="#263238" font-weight="bold">GRAFCET</text>
	<text x="250" y="18" font-size="13" text-anchor="start" fill="#263238" font-weight="bold">Ladder</text>
	<rect x="85" y="28" width="30" height="30" fill="#1976d2" stroke="#263238" stroke-width="1.8" />
	<text x="100" y="48" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
	<rect x="129" y="31" width="76" height="24" fill="#fff" stroke="#263238" stroke-width="1.8" />
