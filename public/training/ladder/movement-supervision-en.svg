	<line x1="100" y1="58" x2="100" y2="80" stroke="#263238" stroke-width="1.8" />
	<line x1="60" y1="80" x2="160" y2="80" stroke="#263238" stroke-width="1.8" />
	<line x1="60" y1="80" x2="60" y2="98" stroke="#263238" stroke-width="1.8" />
