	<text x="74" y="102" font-size="12" text-anchor="start" fill="#263238">b</text>
	<line x1="60" y1="98" x2="60" y2="118" stroke="#263238" stroke-width="1.8" />
	<rect x="45" y="118" width="30" height="30" fill="#fff" stroke="#263238" stroke-width="1.8" />
	<text x="60" y="138" font-size="12" text-anchor="middle" fill="#263238" font-weight="bold">2</text>
	<line x1="160" y1="80" x2="160" y2="98" stroke="#263238" stroke-width="1.8" />
	<line x1="150" y1="98" x2="170" y2="98" stroke="#d84315" stroke-width="3" />
	<text x="174" y="102" font-size="12" text-anchor="start" fill="#d84315">t_watchdog.Q</text>
	<line x1="160" y1="98" x2="160" y2="118" stroke="#d84315" stroke-width="1.8" />
	<rect x="145" y="118" width="30" height="30" fill="#fff" stroke="#263238" stroke-width="1.8" />
	<text x="160" y="138" font-size="12" text-anchor="middle" fill="#263238" font-weight="bold">3</text>
	<rect x="189" y="121" width="50" height="24" fill="#fff" stroke="#263238" stroke-width="1.8" />
	<line x1="175" y1="133" x2="189" y2="133" stroke="#263238" stroke-width="1.8" />
	<text x="214" y="137" font-size="12" text-anchor="middle" fill="#263238">fault</text>
	<text x="8" y="188" font-size="11" text-anchor="start" fill="#455a64">t_watchdog: an 8 s TON</text>
	<text x="8" y="204" font-size="11" text-anchor="start" fill="#455a64">that counts while step 1</text>
	<text x="8" y="220" font-size="11" text-anchor="start" fill="#455a64">is active.</text>
	<line x1="250" y1="40" x2="250" y2="90" stroke="#263238" stroke-width="3" />
	<line x1="540" y1="40" x2="540" y2="90" stroke="#263238" stroke-width="3" />
	<line x1="250" y1="62" x2="276" y2="62" stroke="#263238" stroke-width="2" />
	<line x1="276" y1="52" x2="276" y2="72" stroke="#263238" stroke-width="2.5" />
	<line x1="288" y1="52" x2="288" y2="72" stroke="#263238" stroke-width="2.5" />
	<text x="282" y="47" font-size="11" text-anchor="middle" fill="#263238" font-family="monospace">X1</text>
	<line x1="288" y1="62" x2="330" y2="62" stroke="#263238" stroke-width="2" />
	<rect x="330" y="40" width="100" height="74" fill="#eceff1" stroke="#263238" stroke-width="1.5" rx="4" />
	<text x="380" y="34" font-size="11" text-anchor="middle" fill="#263238" font-weight="bold" font-family="monospace">t_watchdog</text>
	<text x="335" y="66" font-size="10" text-anchor="start" fill="#263238" font-family="monospace">IN</text>
	<text x="425" y="66" font-size="10" text-anchor="end" fill="#263238" font-family="monospace">Q</text>
	<text x="380" y="90" font-size="12" text-anchor="middle" fill="#263238" font-weight="bold">TON</text>
	<text x="335" y="108" font-size="10" text-anchor="start" fill="#263238" font-family="monospace">PT</text>
	<text x="326" y="108" font-size="10" text-anchor="end" fill="#263238">T#8s</text>
	<line x1="430" y1="62" x2="540" y2="62" stroke="#263238" stroke-width="2" />
	<text x="470" y="56" font-size="11" text-anchor="start" fill="#d84315" font-family="monospace">Q</text>
	<line x1="250" y1="152" x2="250" y2="202" stroke="#263238" stroke-width="3" />
	<line x1="540" y1="152" x2="540" y2="202" stroke="#263238" stroke-width="3" />
	<line x1="250" y1="176" x2="300" y2="176" stroke="#263238" stroke-width="2" />
	<line x1="300" y1="166" x2="300" y2="186" stroke="#d84315" stroke-width="2.5" />
	<line x1="312" y1="166" x2="312" y2="186" stroke="#d84315" stroke-width="2.5" />
	<text x="306" y="161" font-size="11" text-anchor="middle" fill="#d84315" font-family="monospace">t_watchdog.Q</text>
	<line x1="312" y1="176" x2="440" y2="176" stroke="#263238" stroke-width="2" />
	<path d="M 448 166 Q 441 176 448 186" fill="none" stroke="#263238" stroke-width="2.5" />
	<path d="M 464 166 Q 471 176 464 186" fill="none" stroke="#263238" stroke-width="2.5" />
	<text x="456" y="179.5" font-size="10" text-anchor="middle" fill="#263238" font-weight="bold">S</text>
	<text x="456" y="161" font-size="11" text-anchor="middle" fill="#263238" font-family="monospace">fault</text>
	<line x1="464" y1="176" x2="540" y2="176" stroke="#263238" stroke-width="2" />
	<text x="250" y="130" font-size="11" text-anchor="start" fill="#455a64">Q becomes true if b has not arrived within 8 s:</text>
	<text x="250" y="232" font-size="11" text-anchor="start" fill="#455a64">1. t_watchdog.Q latches the fault (S coil).</text>
	<text x="250" y="250" font-size="11" text-anchor="start" fill="#455a64">2. t_watchdog.Q also crosses the fallback transition</text>
	<text x="250" y="268" font-size="11" text-anchor="start" fill="#455a64">to step 3 (T = X1 AND t_watchdog.Q).</text>
</svg>
