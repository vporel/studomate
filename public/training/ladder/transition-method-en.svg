<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" font-family="sans-serif">
	<rect x="95" y="10" width="130" height="30" rx="5" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
	<text x="160" y="30" font-size="13" text-anchor="middle" fill="#263238" font-weight="bold">Main</text>

	<line x1="160" y1="40" x2="160" y2="62" stroke="#455a64" stroke-width="2" />
	<path d="M 154 55 L 160 65 L 166 55" fill="none" stroke="#455a64" stroke-width="2" />

	<rect x="20" y="65" width="280" height="100" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" />
	<text x="35" y="88" font-size="13" text-anchor="start" fill="#1b5e20" font-weight="bold">1. Automatic_cycle</text>
	<text x="35" y="108" font-size="11" text-anchor="start" fill="#263238">the initial step, activated only once</text>
	<text x="35" y="126" font-size="11" text-anchor="start" fill="#263238">one network per transition, in order</text>
	<text x="35" y="146" font-size="9.5" text-anchor="start" fill="#455a64">(and the reset, if there is one)</text>

	<line x1="160" y1="165" x2="160" y2="186" stroke="#455a64" stroke-width="2" />
	<path d="M 154 179 L 160 189 L 166 179" fill="none" stroke="#455a64" stroke-width="2" />

	<rect x="20" y="189" width="280" height="80" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5" />
	<text x="35" y="212" font-size="13" text-anchor="start" fill="#e65100" font-weight="bold">2. Outputs</text>
	<text x="35" y="232" font-size="11" text-anchor="start" fill="#263238">one network per output: continuous actions</text>
	<text x="35" y="250" font-size="9.5" text-anchor="start" fill="#455a64" font-family="monospace">action = Xn OR Xm OR ...</text>

	<g transform="rotate(-90 308 150)">
		<text x="308" y="150" font-size="10" fill="#607d8b" text-anchor="middle">execution order</text>
	</g>
</svg>
