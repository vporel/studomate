<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="sans-serif">
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#263238" />
		</marker>
		<marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
		</marker>
		<marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#d84315" />
		</marker>
	</defs>

	<rect x="20" y="30" width="200" height="62" rx="10" fill="#eceff1" stroke="#263238" stroke-width="2" />
	<text x="120" y="57" font-size="14" font-weight="bold" text-anchor="middle" fill="#263238">Running</text>
	<text x="120" y="76" font-size="11" text-anchor="middle" fill="#455a64">conveyor on, parts counted</text>
	<rect x="340" y="30" width="200" height="62" rx="10" fill="#eceff1" stroke="#263238" stroke-width="2" />
	<text x="440" y="57" font-size="14" font-weight="bold" text-anchor="middle" fill="#263238">Case change</text>
	<text x="440" y="76" font-size="11" text-anchor="middle" fill="#455a64">conveyor stopped</text>
	<rect x="180" y="190" width="200" height="62" rx="10" fill="#eceff1" stroke="#263238" stroke-width="2" />
	<text x="280" y="217" font-size="14" font-weight="bold" text-anchor="middle" fill="#263238">Restart</text>
	<text x="280" y="236" font-size="11" text-anchor="middle" fill="#455a64">counter reset to zero</text>

	<!-- Transitions -->
	<line x1="222" y1="61" x2="338" y2="61" stroke="#263238" stroke-width="2.5" marker-end="url(#arrow)" />
	<text x="280" y="52" font-size="11" text-anchor="middle" fill="#263238">5 parts counted</text>
	<path d="M 440 94 Q 440 220 384 221" fill="none" stroke="#263238" stroke-width="2.5" marker-end="url(#arrow)" />
	<text x="452" y="160" font-size="11" text-anchor="start" fill="#263238">5 s elapsed</text>
	<path d="M 178 221 Q 120 220 120 96" fill="none" stroke="#263238" stroke-width="2.5" marker-end="url(#arrow)" />
	<text x="20" y="160" font-size="11" text-anchor="start" fill="#263238">start again</text>
</svg>
