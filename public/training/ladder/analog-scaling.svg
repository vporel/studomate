<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 392" font-family="sans-serif">
	<!-- Raw scale -->
	<text x="40" y="34" font-size="12" font-weight="bold" text-anchor="start" fill="#263238">valeur brute (entrée analogique)</text>
	<rect x="40" y="44" width="460" height="14" fill="#bbdefb" stroke="#263238" stroke-width="1.5" />
	<text x="40" y="74" font-size="11" text-anchor="start" fill="#607d8b">0</text>
	<text x="270" y="74" font-size="11" text-anchor="middle" fill="#607d8b">13 824</text>
	<text x="500" y="74" font-size="11" text-anchor="end" fill="#607d8b">27 648</text>

	<!-- Level scale -->
	<text x="40" y="124" font-size="12" font-weight="bold" text-anchor="start" fill="#263238">niveau (%)</text>
	<rect x="40" y="134" width="460" height="14" fill="#c8e6c9" stroke="#263238" stroke-width="1.5" />
	<text x="40" y="164" font-size="11" text-anchor="start" fill="#607d8b">0</text>
	<text x="270" y="164" font-size="11" text-anchor="middle" fill="#607d8b">50</text>
	<text x="500" y="164" font-size="11" text-anchor="end" fill="#607d8b">100</text>
	<line x1="40" y1="82" x2="40" y2="112" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<line x1="270" y1="82" x2="270" y2="112" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<line x1="500" y1="82" x2="500" y2="112" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />

	<text x="270" y="200" font-size="14" font-weight="bold" text-anchor="middle" fill="#d84315">niveau = brut × 100 ÷ 27 648</text>

	<!-- Wrong order -->
	<rect x="20" y="220" width="500" height="70" rx="6" fill="#ef9a9a" stroke="#c62828" stroke-width="1.5" />
	<path d="M 34 245 l 20 20" fill="none" stroke="#c62828" stroke-width="3.5" stroke-linecap="round" />
	<path d="M 54 245 l -20 20" fill="none" stroke="#c62828" stroke-width="3.5" stroke-linecap="round" />
	<text x="70" y="242" font-size="12" font-weight="bold" text-anchor="start" fill="#263238">Mauvais ordre : brut ÷ 27 648 × 100</text>
	<text x="70" y="262" font-size="11" text-anchor="start" fill="#263238">13 824 ÷ 27 648 vaut 0 en entier (la décimale est perdue),</text>
	<text x="70" y="278" font-size="11" text-anchor="start" fill="#263238">puis 0 × 100 = 0 : le niveau reste à 0 %.</text>

	<!-- Right order -->
	<rect x="20" y="304" width="500" height="70" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5" />
	<path d="M 34 342 l 8 9 l 18 -20" fill="none" stroke="#2e7d32" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
	<text x="70" y="326" font-size="12" font-weight="bold" text-anchor="start" fill="#263238">Bon ordre : brut × 100 ÷ 27 648, calculé en REAL</text>
	<text x="70" y="346" font-size="11" text-anchor="start" fill="#263238">13 824 × 100 = 1 382 400, puis ÷ 27 648 = 50,</text>
	<text x="70" y="362" font-size="11" text-anchor="start" fill="#263238">sans dépassement ni troncature.</text>
</svg>
