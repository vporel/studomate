	<text x="340" y="242" font-size="11" text-anchor="start" fill="#455a64">dès que t_surv.Q est vrai.</text>
	<text x="340" y="276" font-size="11" text-anchor="start" fill="#455a64">Tant que defaut est vrai, dcy ne</text>
