	<line x1="530" y1="40" x2="530" y2="290" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3 3" />
	<text x="8" y="18" font-size="11" text-anchor="start" fill="#607d8b">common time base</text>
	<line x1="206" y1="30" x2="386" y2="30" stroke="#d84315" stroke-width="1.5" />
	<path d="M 208 30 L 384 30" fill="none" stroke="#d84315" stroke-width="1.5" marker-end="url(#arrow)" />
	<text x="296" y="24" font-size="12" text-anchor="middle" fill="#d84315" font-weight="bold">PT = 5 s</text>
	<text x="8" y="66" font-size="12" text-anchor="start" fill="#263238" font-weight="bold">Xn</text>
	<text x="8" y="82" font-size="11" text-anchor="start" fill="#607d8b">step active</text>
	<path d="M 170 80 L 206 80 L 206 50 L 242 50 L 278 50 L 314 50 L 350 50 L 386 50 L 422 50 L 458 50 L 494 50 L 494 80 L 530 80" fill="none" stroke="#263238" stroke-width="2.2" stroke-linejoin="round" />
	<text x="8" y="124" font-size="12" text-anchor="start" fill="#263238" font-weight="bold">Q du TON</text>
	<text x="8" y="140" font-size="11" text-anchor="start" fill="#607d8b">IN = Xn, PT = 5 s</text>
	<path d="M 170 138 L 206 138 L 242 138 L 278 138 L 314 138 L 350 138 L 386 138 L 386 108 L 422 108 L 458 108 L 494 108 L 494 138 L 530 138" fill="none" stroke="#d84315" stroke-width="2.2" stroke-linejoin="round" />
