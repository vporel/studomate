	<text x="8" y="276" font-size="11" text-anchor="start" fill="#607d8b">time-limited action</text>
	<path d="M 170 274 L 206 274 L 206 244 L 242 244 L 278 244 L 314 244 L 350 244 L 386 244 L 386 274 L 422 274 L 458 274 L 494 274 L 530 274" fill="none" stroke="#2e7d32" stroke-width="2.2" stroke-linejoin="round" />
