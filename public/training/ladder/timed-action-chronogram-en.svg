	<text x="530" y="308" font-size="11" text-anchor="middle" fill="#607d8b">10</text>
	<text x="538" y="308" font-size="11" text-anchor="start" fill="#607d8b">s</text>
	<text x="170" y="332" font-size="11" text-anchor="start" fill="#455a64">delayed: starts 5 s after entering the step; limited: stops 5 s after</text>
	<text x="170" y="348" font-size="11" text-anchor="start" fill="#455a64">entering the step. Both stop when the step is deactivated.</text>
</svg>
