<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 292" font-family="sans-serif">
	<text x="20" y="18" font-size="13" text-anchor="start" fill="#263238" font-weight="bold">GRAFCET</text>
	<text x="250" y="18" font-size="13" text-anchor="start" fill="#263238" font-weight="bold">Equivalent Ladder</text>
	<rect x="55" y="30" width="30" height="30" fill="#fff" stroke="#263238" stroke-width="1.8" />
	<text x="70" y="50" font-size="12" text-anchor="middle" fill="#263238" font-weight="bold">n-1</text>
	<line x1="70" y1="60" x2="70" y2="80" stroke="#263238" stroke-width="1.8" />
	<line x1="60" y1="80" x2="80" y2="80" stroke="#263238" stroke-width="3" />
	<text x="84" y="84" font-size="12" text-anchor="start" fill="#263238">Rn-1</text>
	<line x1="70" y1="80" x2="70" y2="100" stroke="#263238" stroke-width="1.8" />
	<rect x="55" y="100" width="30" height="30" fill="#1976d2" stroke="#263238" stroke-width="1.8" />
	<text x="70" y="120" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">n</text>
	<line x1="70" y1="130" x2="70" y2="150" stroke="#263238" stroke-width="1.8" />
	<line x1="60" y1="150" x2="80" y2="150" stroke="#263238" stroke-width="3" />
	<text x="84" y="154" font-size="12" text-anchor="start" fill="#263238">Rn</text>
	<line x1="70" y1="150" x2="70" y2="170" stroke="#263238" stroke-width="1.8" />
	<rect x="55" y="170" width="30" height="30" fill="#fff" stroke="#263238" stroke-width="1.8" />
	<text x="70" y="190" font-size="12" text-anchor="middle" fill="#263238" font-weight="bold">n+1</text>
	<text x="92" y="50" font-size="12" text-anchor="start" fill="#263238">Xn-1</text>
	<text x="92" y="120" font-size="12" text-anchor="start" fill="#263238" font-weight="bold">Xn</text>
	<text x="92" y="190" font-size="12" text-anchor="start" fill="#263238">Xn+1</text>
	<text x="170" y="123" font-size="22" text-anchor="middle" fill="#607d8b">→</text>
	<line x1="250" y1="40" x2="250" y2="150" stroke="#263238" stroke-width="3" />
	<line x1="540" y1="40" x2="540" y2="150" stroke="#263238" stroke-width="3" />
	<line x1="250" y1="90" x2="275" y2="90" stroke="#263238" stroke-width="2" />
	<line x1="275" y1="66" x2="275" y2="118" stroke="#263238" stroke-width="2" />
	<circle cx="275" cy="90" r="2.5" fill="#263238" />
	<line x1="275" y1="66" x2="300" y2="66" stroke="#263238" stroke-width="2" />
	<line x1="314" y1="56" x2="314" y2="76" stroke="#263238" stroke-width="2.5" />
	<line x1="326" y1="56" x2="326" y2="76" stroke="#263238" stroke-width="2.5" />
	<text x="320" y="51" font-size="11" text-anchor="middle" fill="#263238" font-family="monospace">Xn-1</text>
	<line x1="326" y1="66" x2="350" y2="66" stroke="#263238" stroke-width="2" />
	<line x1="354" y1="56" x2="354" y2="76" stroke="#263238" stroke-width="2.5" />
	<line x1="366" y1="56" x2="366" y2="76" stroke="#263238" stroke-width="2.5" />
	<text x="360" y="51" font-size="11" text-anchor="middle" fill="#263238" font-family="monospace">Rn-1</text>
	<line x1="366" y1="66" x2="405" y2="66" stroke="#263238" stroke-width="2" />
	<line x1="275" y1="118" x2="340" y2="118" stroke="#263238" stroke-width="2" />
	<line x1="340" y1="108" x2="340" y2="128" stroke="#263238" stroke-width="2.5" />
	<line x1="352" y1="108" x2="352" y2="128" stroke="#263238" stroke-width="2.5" />
	<text x="346" y="144" font-size="11" text-anchor="middle" fill="#263238" font-family="monospace">Xn</text>
	<line x1="352" y1="118" x2="405" y2="118" stroke="#263238" stroke-width="2" />
	<line x1="405" y1="66" x2="405" y2="118" stroke="#263238" stroke-width="2" />
	<circle cx="405" cy="90" r="2.5" fill="#263238" />
	<line x1="405" y1="90" x2="428" y2="90" stroke="#263238" stroke-width="2" />
	<line x1="434" y1="80" x2="434" y2="100" stroke="#263238" stroke-width="2.5" />
	<line x1="446" y1="80" x2="446" y2="100" stroke="#263238" stroke-width="2.5" />
	<line x1="432" y1="101" x2="448" y2="79" stroke="#263238" stroke-width="2" />
	<text x="440" y="75" font-size="11" text-anchor="middle" fill="#263238" font-family="monospace">Rn</text>
	<line x1="446" y1="90" x2="484" y2="90" stroke="#263238" stroke-width="2" />
	<path d="M 490 80 Q 483 90 490 100" fill="none" stroke="#263238" stroke-width="2.5" />
	<path d="M 506 80 Q 513 90 506 100" fill="none" stroke="#263238" stroke-width="2.5" />
	<text x="498" y="75" font-size="11" text-anchor="middle" fill="#263238" font-family="monospace">Xn</text>
	<line x1="506" y1="90" x2="540" y2="90" stroke="#263238" stroke-width="2" />
	<text x="250" y="172" font-size="11" text-anchor="start" fill="#455a64">Reading: Xn is true if the previous step is active</text>
	<text x="250" y="188" font-size="11" text-anchor="start" fill="#455a64">AND its transition can be crossed, OR if Xn is already</text>
	<text x="250" y="204" font-size="11" text-anchor="start" fill="#455a64">true AND Rn is not yet true.</text>
	<line x1="20" y1="220" x2="540" y2="220" stroke="#cfd8dc" stroke-width="1" />
	<text x="20" y="240" font-size="12" text-anchor="start" fill="#263238" font-family="monospace">Xn = (Xn-1 AND Rn-1) + Xn AND NOT Rn</text>
	<text x="20" y="258" font-size="11" text-anchor="start" fill="#455a64" font-style="italic">Notation: Tn-1 = Xn-1 AND Rn-1 and Tn = Xn AND Rn, so Xn = Tn-1 + Xn AND NOT Tn</text>
	<text x="20" y="278" font-size="11" text-anchor="start" fill="#607d8b">Xn: step n active. Rn: receptivity of the transition after step n. + reads OR.</text>
</svg>
