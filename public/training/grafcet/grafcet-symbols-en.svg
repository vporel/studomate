<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" font-family="sans-serif">
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#263238" />
		</marker>
	</defs>
	<rect x="30" y="20" width="30" height="30" fill="#fff" stroke="#263238" stroke-width="1.8" />
	<text x="45" y="40" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">1</text>
	<text x="160" y="40" font-size="12" text-anchor="start" fill="#263238">inactive step: X1 = FALSE</text>
	<rect x="30" y="75" width="30" height="30" fill="#1976d2" stroke="#263238" stroke-width="1.8" />
	<text x="45" y="95" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">2</text>
	<text x="160" y="95" font-size="12" text-anchor="start" fill="#263238">active step: X2 = TRUE</text>
	<rect x="30" y="130" width="30" height="30" fill="#fff" stroke="#263238" stroke-width="1.8" />
	<rect x="35" y="135" width="20" height="20" fill="none" stroke="#263238" stroke-width="1.8" />
	<text x="45" y="150" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">0</text>
	<text x="160" y="150" font-size="12" text-anchor="start" fill="#263238">initial step (double outline)</text>
	<line x1="45" y1="185" x2="45" y2="235" stroke="#263238" stroke-width="1.8" />
	<line x1="35" y1="210" x2="55" y2="210" stroke="#263238" stroke-width="3" />
	<text x="65" y="214" font-size="12" text-anchor="start" fill="#263238">fin1</text>
	<text x="160" y="214" font-size="12" text-anchor="start" fill="#263238">transition and its receptivity</text>
	<rect x="30" y="250" width="30" height="30" fill="#fff" stroke="#263238" stroke-width="1.8" />
	<text x="45" y="270" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">3</text>
	<rect x="74" y="253" width="80" height="24" fill="#fff" stroke="#263238" stroke-width="1.8" />
	<line x1="60" y1="265" x2="74" y2="265" stroke="#263238" stroke-width="1.8" />
	<text x="114" y="269" font-size="12" text-anchor="middle" fill="#263238">sortie1</text>
	<text x="160" y="269" font-size="12" text-anchor="start" fill="#263238">action, run while the step is active</text>
	<line x1="30" y1="310" x2="30" y2="355" stroke="#263238" stroke-width="1.8" />
	<rect x="85" y="318" width="30" height="30" fill="#fff" stroke="#263238" stroke-width="1.8" />
	<rect x="90" y="323" width="20" height="20" fill="none" stroke="#263238" stroke-width="1.8" />
	<text x="100" y="338" font-size="12" font-weight="bold" text-anchor="middle" fill="#263238">0</text>
	<path d="M 100 348 V 372 H 65 V 300 H 100 V 316" fill="none" stroke="#263238" stroke-width="1.8" marker-end="url(#arrow)" />
	<text x="160" y="335" font-size="12" text-anchor="start" fill="#263238">directed link: read from top to bottom;</text>
	<text x="160" y="352" font-size="12" text-anchor="start" fill="#263238">an arrow only appears to go back up</text>
</svg>
