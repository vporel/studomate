<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="sans-serif">
	<text x="20" y="12" font-size="11" font-weight="bold" fill="#263238">Divergence / convergence OU</text>
	<text x="170" y="12" font-size="11" font-weight="bold" fill="#263238">Divergence / convergence ET</text>
	<line x1="155" y1="8" x2="155" y2="185" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="3,3" />

	<!-- OU : divergence sans barre, une transition par branche -->
	<g stroke="#263238" stroke-width="1.8" fill="none">
		<rect x="70" y="20" width="20" height="20" />
		<line x1="80" y1="40" x2="80" y2="55" />
		<line x1="80" y1="55" x2="50" y2="65" />
		<line x1="80" y1="55" x2="110" y2="65" />
		<line x1="50" y1="65" x2="50" y2="80" />
		<line x1="110" y1="65" x2="110" y2="80" />
		<line x1="44" y1="80" x2="56" y2="80" stroke-width="2.5" />
		<line x1="104" y1="80" x2="116" y2="80" stroke-width="2.5" />
		<line x1="50" y1="80" x2="50" y2="95" />
		<line x1="110" y1="80" x2="110" y2="95" />
		<rect x="40" y="95" width="20" height="20" />
		<rect x="100" y="95" width="20" height="20" />
		<line x1="50" y1="115" x2="50" y2="130" />
		<line x1="110" y1="115" x2="110" y2="130" />
		<line x1="50" y1="130" x2="80" y2="140" />
		<line x1="110" y1="130" x2="80" y2="140" />
		<line x1="80" y1="140" x2="80" y2="155" />
		<rect x="70" y="155" width="20" height="20" />
	</g>
	<g font-size="10" fill="#263238" text-anchor="middle">
		<text x="80" y="34">n</text>
		<text x="50" y="109">a</text>
		<text x="110" y="109">b</text>
		<text x="80" y="169">m</text>
	</g>

	<!-- ET : transition unique puis double barre -->
	<g stroke="#263238" stroke-width="1.8" fill="none">
		<rect x="210" y="20" width="20" height="20" />
		<line x1="220" y1="40" x2="220" y2="60" />
		<line x1="214" y1="50" x2="226" y2="50" stroke-width="2.5" />
		<line x1="190" y1="58" x2="250" y2="58" stroke-width="2.5" />
		<line x1="190" y1="62" x2="250" y2="62" stroke-width="2.5" />
		<line x1="190" y1="62" x2="190" y2="80" />
		<line x1="250" y1="62" x2="250" y2="80" />
		<rect x="180" y="80" width="20" height="20" />
		<rect x="240" y="80" width="20" height="20" />
		<line x1="190" y1="100" x2="190" y2="118" />
		<line x1="250" y1="100" x2="250" y2="118" />
		<line x1="190" y1="118" x2="250" y2="118" stroke-width="2.5" />
		<line x1="190" y1="122" x2="250" y2="122" stroke-width="2.5" />
		<line x1="220" y1="122" x2="220" y2="135" />
		<line x1="214" y1="135" x2="226" y2="135" stroke-width="2.5" />
		<line x1="220" y1="135" x2="220" y2="150" />
		<rect x="210" y="150" width="20" height="20" />
	</g>
	<g font-size="10" fill="#263238" text-anchor="middle">
		<text x="220" y="34">n</text>
		<text x="190" y="94">a</text>
		<text x="250" y="94">b</text>
		<text x="220" y="164">m</text>
	</g>
</svg>
