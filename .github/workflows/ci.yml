name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Une seule exécution par branche : une nouvelle poussée annule la précédente
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      # On veut voir les échecs de toutes les versions, pas seulement de la première
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Le lint ne vérifie pas les types : tsc est une étape distincte et nécessaire
      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
